name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint e formatação
        run: npm run lint && npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm run coverage
      - name: Build
        run: npm run build
